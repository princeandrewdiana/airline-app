<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout}">

	<div th:fragment="content">
	
	    <h2>Airport List</h2>
	
	    <!-- 🔍 FILTER FORM -->
	    <form method="get" action="/airports" style="margin-bottom: 20px;">
	        <input type="text"
	               name="country"
	               placeholder="Country Code (e.g. PH, US)"
	               th:value="${country}" />
	
	        <input type="text"
	               name="city"
	               placeholder="City (e.g. Manila)"
	               th:value="${city}" />
	
	        <button type="submit">Filter</button>
	
	        <a href="/airports">
	            <button type="button">Reset</button>
	        </a>
	    </form>
	
	    <!-- ⚠️ NO DATA MESSAGE -->
	    <div th:if="${#lists.isEmpty(airports)}">
	        <p>No airports found.</p>
	    </div>
	
	    <!-- ✈️ AIRPORT TABLE -->
	    <table th:if="${!#lists.isEmpty(airports)}" border="1" cellpadding="8">
	
	        <thead>
	        <tr>
	            <th>Airport Name</th>
	            <th>IATA</th>
	            <th>City</th>
	            <th>Country</th>
	            <th>Latitude</th>
	            <th>Longitude</th>
	        </tr>
	        </thead>
	
	        <tbody>
	        <tr th:each="a : ${airports}">
	            <td th:text="${a.name}"></td>
	            <td th:text="${a.iata}"></td>
	            <td th:text="${a.city}"></td>
	            <td th:text="${a.countryCode}"></td>
	            <td th:text="${a.lat}"></td>
	            <td th:text="${a.lng}"></td>
	        </tr>
	        </tbody>
	
	    </table>
	
	</div>

</html>
