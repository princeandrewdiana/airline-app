<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout}">

<div th:fragment="content">

    <h2>Airport List</h2>

    <!-- 🔍 FILTER FORM -->
    <form method="get" action="/airports" id="filterForm">

        <!-- 🌍 COUNTRY -->
        <label>Country:</label>
        <select 
			style="padding: 8px; width: 200px;"
			name="country"
            onchange="document.getElementById('filterForm').submit()">

            <option value="">Select Country</option>

            <option th:each="c : ${countries}"
                    th:value="${c.key}"
                    th:text="${c.value}"
                    th:selected="${c.key == selectedCountry}">
            </option>

        </select>

        <!-- 🏙️ CITY -->
        <label style="margin-left: 10px;">City:</label>
        <select 
			style="padding: 8px; width: 200px;" 
			name="city"
			onchange="document.getElementById('filterForm').submit()"
			>

            <option value="">Select City</option>

            <option th:each="c : ${cities}"
                    th:value="${c.city_code}"
                    th:text="${c.name}"
                    th:selected="${c.city_code == selectedCity}">
            </option>

        </select>

        <button type="submit">Filter</button>

        <a href="/airports">
            <button type="button">Reset</button>
        </a>

    </form>

    <hr/>

    <!-- ⚠️ EMPTY STATE -->
    <div th:if="${#lists.isEmpty(airports)}">
        <p>No airports found. Try selecting from the dropdowns.</p>
    </div>

    <!-- ✈️ TABLE -->
    <table th:if="${!#lists.isEmpty(airports)}"
           border="1"
           cellpadding="8"
           style="width:100%; border-collapse: collapse;">

        <thead>
        <tr>
            <th>Airport Name</th>
            <th>IATA Code</th>
            <th>City</th>
            <th>Country</th>
            <th>Latitude</th>
            <th>Longitude</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="a : ${airports}">
            <td th:text="${a.name}"></td>
            <td th:text="${a.iata}"></td>
            <td th:text="${selectedCityObj?.name} ?: 'N/A'"></td>
            <td th:text="${a.countryCode}"></td>
            <td th:text="${a.lat}"></td>
            <td th:text="${a.lng}"></td>
        </tr>
        </tbody>

    </table>

</div>
</html>
